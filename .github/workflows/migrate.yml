name: Migrate

# BEFORE adding any secrets or running this against a project whose
# migration ledger was not built by this workflow, read
# docs/ops/migration-ledger.md. A bare `db push` against prod today would
# replay old migrations (some DROP TABLE ... CASCADE) that the live ledger
# does not list. Never "fix" remote-only versions with
# `migration repair --status reverted`.

# Manual-only until the repo secrets (SUPABASE_ACCESS_TOKEN,
# STAGING_PROJECT_REF/STAGING_DB_PASSWORD, PROD_PROJECT_REF/PROD_DB_PASSWORD)
# and the reviewer-gated `production` environment exist. To re-enable the
# staging auto-run, restore this trigger under `on:`:
#   push:
#     branches: [main]
#     paths: ['supabase/migrations/**', '.github/workflows/migrate.yml']
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      dry_run:
        description: 'Only show what db push would apply (no writes)'
        required: true
        default: true
        type: boolean

concurrency:
  group: migrate-${{ github.workflow }}-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  # =====================================================================
  # Staging — manual dispatch (push trigger disabled, see `on:` above).
  # =====================================================================
  staging:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN STAGING_PROJECT_REF STAGING_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set for the staging environment."
              exit 1
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Link staging project
        run: |
          supabase link \
            --project-ref "$STAGING_PROJECT_REF" \
            --password "$STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF:   ${{ secrets.STAGING_PROJECT_REF }}
          STAGING_DB_PASSWORD:   ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Show pending migrations
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run (what db push would apply)
        run: supabase db push --linked --dry-run --password "$STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}

      - name: Apply migrations to staging
        if: github.event.inputs.dry_run != 'true'
        run: supabase db push --linked --password "$STAGING_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_DB_PASSWORD:   ${{ secrets.STAGING_DB_PASSWORD }}

  # =====================================================================
  # Production — manual dispatch only, gated by the `production`
  # GitHub Environment which requires a reviewer (configure in repo
  # Settings -> Environments -> production).
  # =====================================================================
  production:
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN PROD_PROJECT_REF PROD_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set for the production environment."
              exit 1
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

      - name: Link production project
        run: |
          supabase link \
            --project-ref "$PROD_PROJECT_REF" \
            --password "$PROD_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_PROJECT_REF:      ${{ secrets.PROD_PROJECT_REF }}
          PROD_DB_PASSWORD:      ${{ secrets.PROD_DB_PASSWORD }}

      - name: Show pending migrations
        run: supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry-run schema diff (informational)
        run: supabase db diff --linked --schema public || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry run (what db push would apply)
        run: supabase db push --linked --dry-run --password "$PROD_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

      - name: Apply migrations to production
        if: github.event.inputs.dry_run != 'true'
        run: supabase db push --linked --password "$PROD_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROD_DB_PASSWORD:      ${{ secrets.PROD_DB_PASSWORD }}
