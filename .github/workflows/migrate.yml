name: Migrate

# Applies supabase/migrations/ to production with the Supabase CLI.
#
#   pull_request  -> link prod, `supabase db push --linked --dry-run` (no writes).
#                    The log must list exactly the files the PR adds.
#   push to main  -> same dry run, then the real `supabase db push --linked`.
#   workflow_dispatch -> dry run; set apply=true to push.
#
# Needs repo secrets SUPABASE_ACCESS_TOKEN, PROD_PROJECT_REF, PROD_DB_PASSWORD.
# The remote ledger (supabase_migrations.schema_migrations) must already list
# every file that is live, or db push replays it. How the ledger was aligned
# and how to repair it after a hand/MCP apply: docs/ops/migration-ledger.md
# and .claude/skills/migrate/SKILL.md.

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run the real db push (false = dry run only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# One production push at a time; never cancel one that is already running.
concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_PROJECT_REF: ${{ secrets.PROD_PROJECT_REF }}
      PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      APPLY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          github-token: ${{ github.token }}
          # Same pin as ci.yml db-contract.
          version: 3.4.0

      - name: Require secrets
        run: |
          for v in SUPABASE_ACCESS_TOKEN PROD_PROJECT_REF PROD_DB_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Repo secret $v is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      - name: Link production project
        run: supabase link --project-ref "$PROD_PROJECT_REF" --password "$PROD_DB_PASSWORD"

      - name: Migration list (local vs remote)
        run: supabase migration list --linked --password "$PROD_DB_PASSWORD"

      - name: Dry run (what db push would apply)
        run: supabase db push --linked --dry-run --password "$PROD_DB_PASSWORD"

      - name: Apply migrations to production
        if: env.APPLY == 'true'
        run: supabase db push --linked --password "$PROD_DB_PASSWORD"

      - name: Verify remote is up to date
        if: env.APPLY == 'true'
        run: supabase db push --linked --dry-run --password "$PROD_DB_PASSWORD"
